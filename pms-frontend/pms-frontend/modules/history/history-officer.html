<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking History — Parcel Management System</title>
  <link rel="stylesheet" href="../shared/navbar.css">
  <link rel="stylesheet" href="history-officer.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="container">
    <div class="card">
      <h2>Booking History</h2>
      <form id="filter-form" novalidate>
        <div class="filter-grid">
          <div class="form-group">
            <label for="filterCustomerId">Customer ID</label>
            <input type="text" id="filterCustomerId" placeholder="Customer ID">
          </div>
          <div class="form-group">
            <label for="dateFrom">Date From</label>
            <input type="date" id="dateFrom">
          </div>
          <div class="form-group">
            <label for="dateTo">Date To</label> 
            <input type="date" id="dateTo">
          </div>
          <button type="submit" id="search-btn">Search</button>
        </div>
      </form>
      <table>
        <thead>
          <tr>
            <th>Customer ID</th>
            <th>Booking ID</th>
            <th>Booking Date</th>
            <th>Receiver Name</th>
            <th>Delivered Address</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
      <p id="no-bookings">No bookings match your search.</p>
      <div class="pagination">
        <button type="button" id="prev-btn">Previous</button>
        <span id="page-info"></span>
        <button type="button" id="next-btn">Next</button>
      </div>
    </div>
  </div>

  <script src="../shared/pms-helpers.js"></script>
  <script src="../shared/navbar.js"></script>
  <script src="history-officer.js"></script>
</body>
</html>
