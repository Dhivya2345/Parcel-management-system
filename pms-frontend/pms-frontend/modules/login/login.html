<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Parcel Management System</title>
  
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

  <div class="container login-card">
    <div class="login-brand">
      <span class="mark">PM</span>
      <h1>Parcel Management System</h1>
      <p>Sign in to continue</p>
    </div>

    <div class="card">
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="userId">User ID</label>
          <input type="text" id="userId" name="userId" autocomplete="username" placeholder="Enter your User ID">
          <span class="field-hint">5–20 characters</span>
          <span class="error-msg" id="userId-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password">
          <span class="field-hint">Max 30 characters, needs an uppercase, lowercase, and special character</span>
          <span class="error-msg" id="password-error"></span>
        </div>

        <div class="alert-error" id="form-error" style="display:none; margin-bottom: 12px;"></div>

        <button type="submit" id="submit-btn">Log In</button>
      </form>
    </div>

    <p class="login-footer">
      New customer? <a href="register.html">Register here</a>
    </p>
  </div>

  <script src="../shared/pms-helpers.js"></script>
  <script src="login.js"></script>
</body>
</html>
