spring.application.name=pms-backend
server.port=8080

# ---- MySQL (database is created automatically if missing) ----
spring.datasource.url=jdbc:mysql://localhost:3306/pms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA: tables are created/updated automatically (use 'validate' + migrations in production) ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Not needed: we use JWT, not Spring's default in-memory user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ---- App settings ----
# MUST be changed for any real deployment (>= 32 chars). Prefer the JWT_SECRET env variable.
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-123456}
app.jwt.expiry-minutes=480
# Zone used to validate "pickup must be in the future" and officer date filters
app.timezone=Asia/Kolkata
# Frontend origins allowed to call the API (not needed if you serve the frontend from Spring's /static)
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080
# Seeded officer account: officer1 / <password below>
app.seed.officer-password=${OFFICER_PASSWORD:Officer@1}
